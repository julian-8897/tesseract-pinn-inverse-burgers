[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tesseract-pinn-inverse-burgers"
version = "0.1.0"
description = "Tesseract cross-framework PINN inverse problem for 1D Burgers viscosity inference"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "diffrax>=0.7.0",
    "equinox>=0.13.2",
    "jax>=0.8.2",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "optax>=0.2.6",
    "pydantic>=2.12.5",
    "rich>=14.2.0",
    "seaborn>=0.13.2",
    "streamlit>=1.32.0",
    "tesseract-core[runtime]>=1.2.0",
    "tesseract-jax>=0.2.3",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
]

[tool.setuptools]
py-modules = ["app", "configs", "inverse_problem"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
